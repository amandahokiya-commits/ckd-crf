<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>營養腎隊友 個案紀錄表</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@700&display=swap');
:root{
  --blue:#3b5998;--blue2:#5b7bd5;--green:#2d8659;--green2:#3da670;
  --orange:#d97706;--orange2:#f59e0b;
  --bg:#f7f5f2;--card:#fff;--input-bg:#fefefe;
  --border:#e8e4df;--text:#3d3929;--text2:#7c7567;--text3:#a8a08f;
  --radius:16px;--shadow:0 2px 8px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15.5px;line-height:1.7;letter-spacing:.3px}
.app{max-width:720px;margin:0 auto;padding:12px 16px 80px}
.header{text-align:center;padding:20px 0 8px}
.header h1{font-family:'Noto Serif TC',serif;font-size:21px;color:var(--blue);letter-spacing:2px}
.header p{font-size:11px;color:var(--text3);margin-top:2px}
.tabs{display:flex;gap:5px;justify-content:center;margin:10px 0 14px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:24px;border:1.5px solid var(--border);background:var(--card);color:var(--text2);font-weight:500;font-size:13.5px;cursor:pointer;font-family:inherit;transition:all .2s}
.tab:hover{border-color:var(--blue2);color:var(--blue)}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.tab.t-green.active{background:var(--green);border-color:var(--green)}
.tab.t-orange.active{background:var(--orange);border-color:var(--orange)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card-title{font-weight:700;font-size:16px;color:var(--blue);margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #ede9e3}
.card-title.green{color:var(--green);border-color:#d1e7d9}
.card-title.orange{color:var(--orange);border-color:#fde3cf}
.row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.lbl{min-width:100px;font-weight:500;font-size:14px;color:var(--text2);flex-shrink:0}
.lbl.wide{min-width:140px}
input[type=text],input[type=number],input[type=date],select,textarea{
  flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:10px;font-size:15.5px;
  font-family:inherit;background:var(--input-bg);color:var(--text);min-width:0;transition:border .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue2);box-shadow:0 0 0 3px rgba(59,89,152,.1)}
textarea{resize:vertical;min-height:60px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:7px 15px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);color:var(--text2);font-size:14px;cursor:pointer;font-family:inherit;transition:all .15s}
.pill:hover{border-color:var(--blue2)}
.pill.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.pill.sel-green{background:var(--green);color:#fff;border-color:var(--green)}
.sub{font-weight:700;font-size:14.5px;color:var(--blue2);margin:16px 0 8px;padding:6px 0;border-bottom:1px dashed #d0d5dd}
.sub.green{color:var(--green2)}.sub.orange{color:var(--orange)}
.auto-val{background:#eef2ff;border-radius:8px;padding:4px 10px;font-weight:600;color:var(--blue);font-size:14px;min-width:60px;text-align:center}
.auto-val.green{background:#ecfdf5;color:var(--green)}
.auto-val.orange{background:#fff7ed;color:var(--orange)}
.warn{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px 14px;margin:8px 0;font-size:13px;color:#991b1b;display:none}
.warn.show{display:block}
.note{font-size:12px;color:var(--text3);margin-top:2px}
.btn{padding:10px 20px;border-radius:10px;border:none;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:var(--blue2)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:var(--green2)}
.btn-orange{background:var(--orange);color:#fff}.btn-orange:hover{background:var(--orange2)}
.btn-gray{background:#e5e7eb;color:var(--text)}.btn-gray:hover{background:#d1d5db}
.btn-new{background:linear-gradient(135deg,#f472b6,#ec4899);color:#fff;border-radius:24px;padding:16px 36px;font-size:17px;font-weight:700;box-shadow:0 4px 16px rgba(236,72,153,.35);letter-spacing:1px;transition:all .2s}
.btn-new:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(236,72,153,.45)}
.sga-wrap{background:linear-gradient(135deg,#f0f4ff,#e8ecf8);border:2px solid #c7d2fe;border-radius:20px;padding:20px 16px;margin:16px 0}
.sga-wrap.green{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#86efac}
.sga-h{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:700;color:var(--blue);text-align:center;margin-bottom:4px}
.sga-h.green{color:var(--green)}
.sga-cite{font-size:11px;color:var(--text3);text-align:center;margin-bottom:14px}
.sga-card{background:#f8fafc;padding:12px;margin:8px 0;border-radius:10px}
.sga-card.green{background:#f0fdf4}
.sga-card-t{font-weight:700;font-size:13px;margin-bottom:8px}
/* range row */
.range-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.range-row .lbl{min-width:120px}
.range-row input{width:80px;flex:none;text-align:center;padding:8px 6px}
.range-row .tilde{color:var(--text3);font-size:16px}
.range-row .unit{font-size:13px;color:var(--text3);min-width:30px}
.achieve{display:inline-block;padding:3px 10px;border-radius:8px;font-weight:600;font-size:13px}
.achieve.ok{background:#dcfce7;color:#16a34a}.achieve.ng{background:#fee2e2;color:#dc2626}
/* checkboxes for supplements */
.chk-grid{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chk-item{display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;padding:5px 10px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);transition:all .15s}
.chk-item.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.chk-item.on-green{background:var(--green);color:#fff;border-color:var(--green)}
.chk-item.on-orange{background:var(--orange);color:#fff;border-color:var(--orange)}
.sticky-note{position:sticky;bottom:0;z-index:10;margin:12px -18px -18px;border-top:2px solid #fbbf24;border-radius:0 0 var(--radius) var(--radius);background:#fffbeb;transition:all .2s}
.sticky-note summary{padding:10px 16px;cursor:pointer;font-weight:600;font-size:13px;color:var(--orange);list-style:none;display:flex;align-items:center;gap:6px}
.sticky-note summary::before{content:"📝"}
.sticky-note summary::after{content:"▸";transition:transform .2s;margin-left:auto;font-size:14px}
.sticky-note[open] summary::after{transform:rotate(90deg)}
.sticky-note textarea{width:100%;min-height:120px;border:none;background:transparent;padding:0 16px 14px;font-size:14px;font-family:inherit;resize:vertical;color:var(--text);line-height:1.8}
.sticky-note textarea:focus{outline:none}
.week-badge{display:inline-block;padding:2px 8px;border-radius:10px;background:#dbeafe;color:#1d4ed8;font-size:11px;font-weight:600;margin-left:6px}
.comorbid-other{margin-top:8px}
.patient-bar{background:linear-gradient(135deg,#1e3a5f,#2d5a8e);color:#fff;border-radius:14px;padding:10px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;box-shadow:0 2px 8px rgba(30,58,95,.25);position:sticky;top:0;z-index:20}
.patient-bar .pb-name{font-weight:700;font-size:16px;letter-spacing:.5px}
.patient-bar .pb-info{font-size:12.5px;opacity:.85}
.patient-bar .pb-back{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.patient-bar .pb-back:hover{background:rgba(255,255,255,.35)}
.actions{display:flex;gap:8px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.flash{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#065f46;color:#fff;padding:10px 24px;border-radius:12px;font-weight:600;z-index:99;display:none;font-size:14px}
.hidden{display:none}
.cond{display:none}.cond.show{display:block}
.diet-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.diet-table th{background:#f1f5f9;padding:8px;text-align:left;font-weight:600;border-bottom:2px solid var(--border)}
.diet-table td{padding:6px 8px;border-bottom:1px solid var(--border)}
.diet-table textarea{width:100%;min-height:40px;font-size:13px;border:1px solid var(--border);border-radius:8px;padding:6px;font-family:inherit}
.list-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
.list-table th{background:var(--blue);color:#fff;padding:8px 6px;text-align:center;font-weight:600;position:sticky;top:0;font-size:12px}
.list-table td{padding:6px;text-align:center;border-bottom:1px solid var(--border)}
.list-table tr:hover td{background:#f0f7ff}
.list-table .act-btn{padding:4px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:12px;font-family:inherit}
.list-table .act-btn:hover{background:#f0f4ff}
@media(max-width:480px){.lbl{min-width:80px;font-size:12px}.lbl.wide{min-width:110px}.tab{padding:6px 12px;font-size:11.5px}.range-row input{width:65px}}
</style>
</head>
<body>
<div class="app">
<div class="header">
  <h1>營養腎隊友 個案紀錄表</h1>
  <p>Case Report Form (CRF) v8 ｜ 2026.03.27</p>
</div>
<div class="tabs" id="tabbar"></div>
<div id="patientBar" class="hidden"></div>
<div id="flash" class="flash"></div>
<div id="formArea" class="hidden"></div>
<div id="listArea"></div>
</div>
<script>
const TABS=[{id:"basic",label:"基本資料",cls:""},{id:"pre",label:"前測 SGA",cls:""},{id:"target",label:"目標設定",cls:"t-orange"},{id:"post",label:"後測",cls:"t-green"},{id:"sus",label:"SUS",cls:"t-green"}];
const SGA_B=[{id:"sgaFatLoss",l:"皮下脂肪喪失（三頭肌、胸部）"},{id:"sgaMuscleLoss",l:"肌肉耗損（四頭肌、三角肌）"},{id:"sgaEdemaAnkle",l:"腳踝水腫"},{id:"sgaEdemaSacral",l:"薦骨水腫"},{id:"sgaAscites",l:"腹水"}];
const SUS_Q=["我想我會經常使用這個系統","我認為這個系統過於複雜","我認為這個系統容易使用","我需要技術人員的幫助才能使用這個系統","我發現系統的各項功能整合良好","我覺得這個系統有太多不一致的地方","我認為大多數人能很快學會使用這個系統","我覺得使用這個系統很繁瑣","我對使用這個系統很有信心","我需要學習很多東西才能使用這個系統"];
const MEALS=["早餐","午餐","晚餐","點心"];
const SUPPS=["亞培腎補納","益力壯慎補","桂格完膳腎臟病配方","力增 腎臟病未洗腎配方","百仕可慎護","益力勝慎前","倍速力 慢性腎臟病專用","三多補体康低蛋白","三多補体素低蛋白","偉力健 LPN","愛斯康腎利","易能充","其他"];
// Target items matching backend screenshot
const T_MACRO=[{k:"cal",e:"🔥",l:"熱量",u:"kcal"},{k:"pro",e:"🥩",l:"蛋白質",u:"g"},{k:"fat",e:"🍖",l:"脂肪",u:"g"},{k:"cho",e:"🍚",l:"碳水化合物",u:"g"},{k:"water",e:"💧",l:"飲水量",u:"mL"}];
const T_CKD=[{k:"na",e:"🧂",l:"鈉",u:"mg"},{k:"p",e:"🧪",l:"磷",u:"mg"},{k:"k",e:"🍌",l:"鉀",u:"mg"}];
const T_SIX=[{k:"grain",e:"🌾",l:"全穀雜糧",u:"份"},{k:"meat",e:"🍖",l:"豆魚蛋肉",u:"份"},{k:"veg",e:"🥦",l:"蔬菜類",u:"份"},{k:"fruit",e:"🍎",l:"水果類",u:"份"},{k:"dairy",e:"🥛",l:"乳品類",u:"份"},{k:"oil",e:"🥜",l:"油脂堅果",u:"份"}];
const ALL_T=[...T_MACRO,...T_CKD,...T_SIX];

const WEEK_START=new Date("2026-03-25");
const calcWeek=(dateStr)=>{if(!dateStr)return"";const d=new Date(dateStr);const diff=Math.floor((d-WEEK_START)/(7*24*60*60*1000));return"W"+(Math.max(1,diff+1))};

function newF(){
  const f={subjectId:"",name:"",birthday:"",age:"",sex:"",height:"",weight:"",bmi:"",
    activity:"",ckdStage:"",dm:"",htn:"",hyperlipidemia:"",comorbidOther:"",assessor:"莊曉雯",
    antihtn:"",antihtnName:"",antiDM:"",antiDMName:"",lipidMed:"",lipidMedName:"",kBinder:"",kBinderName:"",pBinder:"",pBinderName:"",
    // current supplements (basic)
    ...Object.fromEntries(SUPPS.map((_,i)=>["supp_cur_"+i,""])),suppCurOther:"",
    // Pre
    preDate:"",preLabDate:"",postDate:"",
    preEgfr:"",preEgfrHas:"",preAlb:"",preAlbHas:"",preK:"",preKHas:"",preP:"",prePHas:"",preHb:"",preHbHas:"",
    // Pre SGA A
    preW6m:"",preWchange:"",preWchangePct:"",preWt2wk:"",
    preDietChange:"",preDietDuration:"",preDietType:"",
    preGI_none:"",preGI_nausea:"",preGI_vomit:"",preGI_diarrhea:"",preGI_anorexia:"",
    preFunc:"",preFuncDuration:"",preFuncType:"",
    preDxMain:"",preDxStress:"",
    ...Object.fromEntries(SGA_B.map(x=>[x.id,""])),
    sgaRating:"",
    ...Object.fromEntries(MEALS.map(m=>["preDiet_"+m,""])),
    ...Object.fromEntries(ALL_T.flatMap(t=>[["preOld_"+t.k+"_lo",""],["preOld_"+t.k+"_hi",""],["preActual_"+t.k,""]])),
    preNote:"",
    // Target (ranges)
    ...Object.fromEntries(ALL_T.flatMap(t=>[["t_"+t.k+"_lo",""],["t_"+t.k+"_hi",""]])),
    ...Object.fromEntries(SUPPS.map((_,i)=>["supp_rec_"+i,""])),suppRecOther:"",
    // Post
    postWeight:"",postBmi:"",
    postEgfr:"",postAlb:"",postK:"",postP:"",postHb:"",
    postW6m:"",postWchange:"",postWchangePct:"",postWt2wk:"",
    postDietChange:"",postDietDuration:"",postDietType:"",
    postGI_none:"",postGI_nausea:"",postGI_vomit:"",postGI_diarrhea:"",postGI_anorexia:"",
    postFunc:"",postFuncDuration:"",postFuncType:"",
    postDxMain:"",postDxStress:"",
    ...Object.fromEntries(SGA_B.map(x=>["post_"+x.id,""])),
    postSgaRating:"",
    ...Object.fromEntries(MEALS.map(m=>["postDiet_"+m,""])),
    ...Object.fromEntries(ALL_T.map(t=>["postActual_"+t.k,""])),
    postNote:"",
    // SUS
    ...Object.fromEntries(SUS_Q.map((_,i)=>["sus"+(i+1),""])),susScore:"",
  };return f;
}

let F=newF(),recs=JSON.parse(localStorage.getItem("crf8")||localStorage.getItem("crf7")||"[]"),editIdx=null,curTab="basic";
const persist=()=>localStorage.setItem("crf8",JSON.stringify(recs));
const flash=msg=>{const el=document.getElementById("flash");el.textContent=msg;el.style.display="block";setTimeout(()=>el.style.display="none",2000)};

// === Helpers ===
const mkCard=(t,cls)=>{const d=document.createElement("div");d.className="card";const h=document.createElement("div");h.className="card-title"+(cls?" "+cls:"");h.textContent=t;d.appendChild(h);return d};
const mkRow=(label,el,wide)=>{const r=document.createElement("div");r.className="row";if(label){const l=document.createElement("div");l.className="lbl"+(wide?" wide":"");l.textContent=label;r.appendChild(l)}if(el)r.appendChild(el);return r};
const mkI=(key,opts={})=>{const i=document.createElement("input");i.type=opts.type||"text";if(opts.ph)i.placeholder=opts.ph;if(opts.step)i.step=opts.step;i.value=F[key]||"";i.addEventListener("input",()=>{F[key]=i.value;if(opts.onChange)opts.onChange()});i.dataset.key=key;return i};
const mkP=(key,opts,cls)=>{const d=document.createElement("div");d.className="pills";opts.forEach(o=>{const b=document.createElement("button");b.type="button";b.className="pill"+(F[key]===o?(" sel"+(cls?" "+cls:"")):"");b.textContent=o;b.addEventListener("click",()=>{F[key]=o;d.querySelectorAll(".pill").forEach(p=>p.className="pill");b.className="pill sel"+(cls?" "+cls:"");document.querySelectorAll(".cond").forEach(updateCond)});d.appendChild(b)});return d};
const mkAuto=(key,cls)=>{const s=document.createElement("span");s.className="auto-val"+(cls?" "+cls:"");s.id="auto_"+key;s.textContent=F[key]||"—";return s};
const mkSub=(t,cls)=>{const d=document.createElement("div");d.className="sub"+(cls?" "+cls:"");d.textContent=t;return d};
const mkNote=t=>{const d=document.createElement("div");d.className="note";d.textContent=t;return d};
const mkTA=(key,ph)=>{const t=document.createElement("textarea");t.placeholder=ph||"";t.value=F[key]||"";t.addEventListener("input",()=>{F[key]=t.value});return t};
const updateCond=()=>{document.querySelectorAll(".cond").forEach(el=>{el.classList.toggle("show",F[el.dataset.condKey]===el.dataset.condVal)})};
const mkCond=(key,val)=>{const d=document.createElement("div");d.className="cond"+(F[key]===val?" show":"");d.dataset.condKey=key;d.dataset.condVal=val;return d};
const calcBMI=(hk,wk,bk)=>{const h=parseFloat(F[hk]),w=parseFloat(F[wk]);if(h>0&&w>0){const b=(w/((h/100)**2)).toFixed(1);F[bk]=b;const el=document.getElementById("auto_"+bk);if(el)el.textContent=b}else{F[bk]="";const el=document.getElementById("auto_"+bk);if(el)el.textContent="—"}};
const calcAge=()=>{if(!F.birthday)return;const b=new Date(F.birthday),t=new Date();let a=t.getFullYear()-b.getFullYear();if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))a--;F.age=String(a);const el=document.getElementById("auto_age");if(el)el.textContent=a+"歲"};
const calcPostDate=()=>{if(!F.preDate)return;const d=new Date(F.preDate);d.setMonth(d.getMonth()+3);if(!F.postDate)F.postDate=d.toISOString().slice(0,10);const el=document.querySelector('[data-key="postDate"]');if(el&&!el.value)el.value=F.postDate};
const calcWc=(w6k,wk,ck,pk)=>{const w6=parseFloat(F[w6k]),w=parseFloat(F[wk]);if(w6>0&&w>0){const c=(w6-w).toFixed(1),p=((w6-w)/w6*100).toFixed(1);F[ck]=c;F[pk]=p;const e1=document.getElementById("auto_"+ck);if(e1)e1.textContent=(c>0?"-":"+")+Math.abs(c)+"kg";const e2=document.getElementById("auto_"+pk);if(e2)e2.textContent=(p>0?"-":"+")+Math.abs(p)+"%"}};

// Range input row with emoji
function mkRange(tItem,prefix){
  const r=document.createElement("div");r.className="range-row";
  const l=document.createElement("div");l.className="lbl";l.textContent=tItem.e+" "+tItem.l;r.appendChild(l);
  const loK=prefix+tItem.k+"_lo",hiK=prefix+tItem.k+"_hi";
  // Target value input (auto-calc 80%~120%)
  const tv=document.createElement("input");tv.type="number";tv.step="0.1";tv.placeholder="目標值";tv.style.cssText="width:75px;text-align:center;border:1.5px solid var(--orange);border-radius:10px;background:#fffbeb";
  // if lo/hi already set, back-calc target as midpoint
  if(F[loK]&&F[hiK]){const mid=((parseFloat(F[loK])+parseFloat(F[hiK]))/2);tv.value=mid?mid.toFixed(1):"";}
  tv.addEventListener("input",()=>{
    const v=parseFloat(tv.value);
    if(v>0){const loV=(v*0.8).toFixed(1),hiV=(v*1.2).toFixed(1);F[loK]=loV;F[hiK]=hiV;lo.value=loV;hi.value=hiV}
  });
  r.appendChild(tv);
  const arr=document.createElement("span");arr.style.cssText="color:var(--orange);font-size:12px;font-weight:600";arr.textContent="→";r.appendChild(arr);
  const lo=document.createElement("input");lo.type="number";lo.step="0.1";lo.value=F[loK]||"";lo.placeholder="下限";lo.addEventListener("input",()=>{F[loK]=lo.value});lo.dataset.key=loK;r.appendChild(lo);
  const til=document.createElement("span");til.className="tilde";til.textContent="~";r.appendChild(til);
  const hi=document.createElement("input");hi.type="number";hi.step="0.1";hi.value=F[hiK]||"";hi.placeholder="上限";hi.addEventListener("input",()=>{F[hiK]=hi.value});hi.dataset.key=hiK;r.appendChild(hi);
  const u=document.createElement("span");u.className="unit";u.textContent=tItem.u;r.appendChild(u);
  return r;
}

// Supplements checkbox grid
function mkSupps(prefix,cls){
  const d=document.createElement("div");d.className="chk-grid";
  SUPPS.forEach((s,i)=>{

  cpo.appendChild(mkSub("24小時飲食紀錄","green"));cpo.appendChild(mkNote("若病人有完整系統紀錄可跳過"));
  const pdt=document.createElement("table");pdt.className="diet-table";const pdh=document.createElement("tr");["餐次","食物品項與份量"].forEach(h=>{const th=document.createElement("th");th.textContent=h;pdh.appendChild(th)});pdt.appendChild(pdh);
  MEALS.forEach(m=>{const tr=document.createElement("tr");const td1=document.createElement("td");td1.style.cssText="width:70px;font-weight:600";td1.textContent=m;tr.appendChild(td1);const td2=document.createElement("td");td2.appendChild(mkTA("postDiet_"+m,"輸入食物..."));tr.appendChild(td2);pdt.appendChild(tr)});cpo.appendChild(pdt);
  // Post achieve (target range vs actual)
  cpo.appendChild(mkSub("攝取達成率（目標 vs 後測實際）","green"));
  cpo.appendChild(mkNote("目標值自動帶入目標設定頁"));
  ALL_T.forEach(t=>{
    const r=document.createElement("div");r.className="range-row";
    r.appendChild(Object.assign(document.createElement("div"),{className:"lbl",textContent:t.e+" "+t.l}));
    const tlo=F["t_"+t.k+"_lo"]||"—",thi=F["t_"+t.k+"_hi"]||"—";
    r.appendChild(Object.assign(document.createElement("span"),{className:"auto-val orange",textContent:tlo+" ~ "+thi,style:"font-size:12px;min-width:100px"}));
    r.appendChild(Object.assign(document.createElement("span"),{className:"unit",textContent:t.u}));
    const ak="postActual_"+t.k;
    r.appendChild(Object.assign(document.createElement("span"),{className:"unit",textContent:"實際:"}));
    const ac=document.createElement("input");ac.type="number";ac.step="0.1";ac.value=F[ak]||"";ac.style.width="70px";ac.addEventListener("input",()=>{F[ak]=ac.value;updPostAch()});r.appendChild(ac);
    const ach=document.createElement("span");ach.id="ach_post_"+t.k;ach.className="achieve";ach.textContent="—";r.appendChild(ach);
    cpo.appendChild(r);
  });
  const updPostAch=()=>{ALL_T.forEach(t=>{const lo=parseFloat(F["t_"+t.k+"_lo"]),hi=parseFloat(F["t_"+t.k+"_hi"]),ac=parseFloat(F["postActual_"+t.k]);const el=document.getElementById("ach_post_"+t.k);if(!el)return;if(isNaN(lo)||isNaN(hi)||isNaN(ac)){el.textContent="—";el.className="achieve";return}if(ac>=lo&&ac<=hi){el.textContent="✓ 達成";el.className="achieve ok"}else{el.textContent="✗ 未達";el.className="achieve ng"}})};updPostAch();
  cpo.appendChild(mkRow("後測備註",mkTA("postNote","其他觀察記錄...")));
  s3.appendChild(cpo);area.appendChild(s3);

  // SUS
  const s4=document.createElement("div");s4.id="sec_sus";s4.className=curTab==="sus"?"":"hidden";
  let cs=mkCard("SUS 系統使用性量表","green");
  // SUS scale header with labels aligned to pills
  const susScale=document.createElement("div");susScale.style.cssText="display:flex;justify-content:flex-end;gap:6px;margin-bottom:12px;padding-right:4px";
  ["非常不同意","不同意","普通","同意","非常同意"].forEach(t=>{
    const sp=document.createElement("span");sp.style.cssText="width:50px;text-align:center;font-size:11px;color:var(--text3);font-weight:500";sp.textContent=t;susScale.appendChild(sp);
  });
  cs.appendChild(susScale);
  SUS_Q.forEach((q,i)=>{
    const row=document.createElement("div");row.style.cssText="margin-bottom:12px";
    const ql=document.createElement("div");ql.style.cssText="font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px";ql.textContent=(i+1)+". "+q;row.appendChild(ql);
    const pd=document.createElement("div");pd.style.cssText="display:flex;justify-content:flex-end;gap:6px";
    ["1","2","3","4","5"].forEach(v=>{
      const b=document.createElement("button");b.type="button";b.style.cssText="width:50px;height:36px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--text2);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s";
      if(F["sus"+(i+1)]===v){b.style.background="var(--green)";b.style.color="#fff";b.style.borderColor="var(--green)"}
      b.textContent=v;
      b.addEventListener("click",()=>{F["sus"+(i+1)]=v;pd.querySelectorAll("button").forEach(p=>{p.style.background="var(--card)";p.style.color="var(--text2)";p.style.borderColor="var(--border)"});b.style.background="var(--green)";b.style.color="#fff";b.style.borderColor="var(--green)";setTimeout(calcSUS,50)});
      pd.appendChild(b);
    });
    row.appendChild(pd);cs.appendChild(row);
  });
  const calcSUS=()=>{const v=SUS_Q.map((_,i)=>parseInt(F["sus"+(i+1)])||0);if(v.some(x=>x===0)){F.susScore="";const el=document.getElementById("auto_susScore");if(el)el.textContent="—";return}let s=0;v.forEach((x,i)=>{s+=(i%2===0)?(x-1):(5-x)});const sc=(s*2.5).toFixed(1);F.susScore=sc;const el=document.getElementById("auto_susScore");if(el){let g="";const n=parseFloat(sc);if(n>=80.3)g="A (優秀)";else if(n>=68)g="C (可接受)";else g="F (需改善)";el.textContent=sc+" — "+g}};
  const susR=document.createElement("div");susR.className="row";susR.appendChild(Object.assign(document.createElement("div"),{className:"lbl wide",textContent:"SUS 分數"}));susR.appendChild(mkAuto("susScore","green"));cs.appendChild(susR);
  s4.appendChild(cs);area.appendChild(s4);
  calcSUS();

  // Actions
  const acts=document.createElement("div");acts.className="actions";
  const saveBtn=document.createElement("button");saveBtn.className="btn btn-blue";saveBtn.textContent="💾 儲存";
  saveBtn.addEventListener("click",doSave);acts.appendChild(saveBtn);
  const backBtn=document.createElement("button");backBtn.className="btn btn-gray";backBtn.textContent="← 返回總表";backBtn.addEventListener("click",showList);acts.appendChild(backBtn);
  area.appendChild(acts);
  updateCond();
}

function switchTab(id){curTab=id;TABS.forEach(t=>{const s=document.getElementById("sec_"+t.id);if(s)s.className=t.id===id?"":"hidden"});document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tid===id))}
function updateTabbar(){const bar=document.getElementById("tabbar");bar.innerHTML="";if(document.getElementById("formArea").className==="hidden"){bar.className="tabs hidden";return}bar.className="tabs";TABS.forEach(t=>{const b=document.createElement("button");b.className="tab"+(t.cls?" "+t.cls:"")+(curTab===t.id?" active":"");b.textContent=t.label;b.dataset.tid=t.id;b.addEventListener("click",()=>switchTab(t.id));bar.appendChild(b)})}
function updatePatientBar(){const pb=document.getElementById("patientBar");if(document.getElementById("formArea").className==="hidden"){pb.className="hidden";return}pb.className="patient-bar";pb.innerHTML="";
  const info=document.createElement("div");
  const nm=document.createElement("span");nm.className="pb-name";nm.textContent=(F.subjectId||"新個案")+(F.name?" "+F.name:"");info.appendChild(nm);
  const det=document.createElement("div");det.className="pb-info";
  const parts=[];if(F.ckdStage)parts.push("CKD "+F.ckdStage);if(F.dm==="有")parts.push("DM");if(F.age)parts.push(F.age+"歲");const wk=calcWeek(F.preDate);if(wk)parts.push(wk);
  det.textContent=parts.join(" · ");info.appendChild(det);pb.appendChild(info);
  const btns=document.createElement("div");btns.style.cssText="display:flex;gap:6px";
  const save=document.createElement("button");save.className="pb-back";save.style.background="rgba(45,134,89,.8)";save.textContent="💾 儲存";save.addEventListener("click",doSave);btns.appendChild(save);
  const back=document.createElement("button");back.className="pb-back";back.textContent="← 總表";back.addEventListener("click",showList);btns.appendChild(back);
  pb.appendChild(btns);
}
function doSave(){
  if(!F.subjectId)return flash("請先填寫受試者編號");
  const ex=recs.findIndex(r=>r.subjectId===F.subjectId);
  if(editIdx!==null){recs[editIdx]={...F}}
  else if(ex>=0){recs[ex]={...F};editIdx=ex}
  else{recs.push({...F});editIdx=recs.length-1}
  persist();flash("✓ 已儲存 "+F.subjectId);updateTabbar();updatePatientBar();
}
function showList(){
  document.getElementById("formArea").className="hidden";document.getElementById("patientBar").className="hidden";const area=document.getElementById("listArea");area.className="";area.innerHTML="";updateTabbar();
  const h=document.createElement("h2");h.style.cssText="text-align:center;color:var(--blue);margin:16px 0 8px;font-size:18px";h.textContent="個案總表 ("+recs.length+"筆)";area.appendChild(h);
  const aR=document.createElement("div");aR.style.cssText="display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap";
  const nB=document.createElement("button");nB.className="btn btn-new";nB.textContent="＋ 新增個案";nB.addEventListener("click",()=>{F=newF();editIdx=null;enterForm()});aR.appendChild(nB);
  const eB=document.createElement("button");eB.className="btn btn-green";eB.textContent="⬇ 匯出Excel";eB.addEventListener("click",exportXLSX);aR.appendChild(eB);
  const iB=document.createElement("button");iB.className="btn btn-gray";iB.textContent="⬆ 匯入";const iI=document.createElement("input");iI.type="file";iI.accept=".xlsx,.csv";iI.style.display="none";iI.addEventListener("change",importFile);iB.addEventListener("click",()=>iI.click());aR.appendChild(iB);aR.appendChild(iI);
  area.appendChild(aR);
  if(recs.length===0){area.appendChild(Object.assign(document.createElement("div"),{style:"text-align:center;color:var(--text3);padding:40px",textContent:"尚無個案資料"}));return}
  // Search
  const sR=document.createElement("div");sR.style.cssText="margin:8px 0 12px;display:flex;justify-content:center";
  const sI=document.createElement("input");sI.type="text";sI.placeholder="🔍 搜尋編號或姓名...";sI.style.cssText="width:280px;padding:10px 16px;border:1.5px solid var(--border);border-radius:24px;font-size:13px;font-family:inherit;background:var(--card);text-align:center";sR.appendChild(sI);area.appendChild(sR);
  const wrap=document.createElement("div");wrap.style.overflowX="auto";
  const tbl=document.createElement("table");tbl.className="list-table";
  const thead=document.createElement("tr");["#","週次","編號","姓名","CKD","前eGFR","前Alb","前SGA","後eGFR","後Alb","後SGA","SUS","操作"].forEach(h=>{const th=document.createElement("th");th.textContent=h;thead.appendChild(th)});tbl.appendChild(thead);
  recs.forEach((r,i)=>{const tr=document.createElement("tr");[i+1,calcWeek(r.preDate),r.subjectId,r.name,r.ckdStage,r.preEgfr,r.preAlb,r.sgaRating,r.postEgfr,r.postAlb,r.postSgaRating,r.susScore].forEach(v=>{const td=document.createElement("td");td.textContent=v||"—";tr.appendChild(td)});
    const td=document.createElement("td");const eb=document.createElement("button");eb.className="act-btn";eb.textContent="編輯";eb.addEventListener("click",()=>{F={...recs[i]};editIdx=i;enterForm()});
    const db=document.createElement("button");db.className="act-btn";db.style.marginLeft="4px";db.textContent="刪除";db.addEventListener("click",()=>{if(confirm("確定刪除？")){recs.splice(i,1);persist();showList()}});td.appendChild(eb);td.appendChild(db);tr.appendChild(td);tbl.appendChild(tr)});
  wrap.appendChild(tbl);area.appendChild(wrap);
  sI.addEventListener("input",()=>{const q=sI.value.toLowerCase().trim();tbl.querySelectorAll("tr").forEach((tr,i)=>{if(i===0)return;const t=(tr.children[2]?.textContent||"")+(tr.children[3]?.textContent||"");tr.style.display=t.toLowerCase().includes(q)?"":"none"})});
}
function enterForm(){document.getElementById("listArea").className="hidden";document.getElementById("formArea").className="";buildForm();switchTab("basic");updateTabbar();updatePatientBar()}
function showForm(){enterForm()}
function buildColMap(){
  const COL_MAP={subjectId:"受試者編號",name:"姓名",birthday:"生日",age:"年齡",sex:"性別",height:"身高cm",weight:"體重kg",bmi:"BMI",activity:"活動量",ckdStage:"CKD分期",dm:"DM",htn:"HTN",hyperlipidemia:"高血脂",comorbidOther:"其他共病",assessor:"評估者",
    antihtn:"降血壓藥",antihtnName:"降血壓藥名",antiDM:"降血糖藥",antiDMName:"降血糖藥名",lipidMed:"血脂用藥",lipidMedName:"血脂藥名",kBinder:"鉀結合劑",kBinderName:"鉀結合劑藥名",pBinder:"磷結合劑",pBinderName:"磷結合劑藥名",
    suppCurOther:"其他營養品_目前",suppRecOther:"其他營養品_建議",
    preDate:"前測日期",preLabDate:"檢驗日期",postDate:"後測日期",
    preEgfr:"前測_eGFR",preEgfrHas:"前測_eGFR有無",preAlb:"前測_Albumin",preAlbHas:"前測_Alb有無",preK:"前測_K",preKHas:"前測_K有無",preP:"前測_P",prePHas:"前測_P有無",preHb:"前測_Hb",preHbHas:"前測_Hb有無",
    preW6m:"前測_6月前體重",preWchange:"前測_體重減輕kg",preWchangePct:"前測_體重減輕%",preWt2wk:"前測_近2週體重變化",
    preDietChange:"前測_飲食變化",preDietDuration:"前測_飲食變化期間_週",preDietType:"前測_飲食變化方式",
    preGI_none:"前測_GI無症狀",preGI_nausea:"前測_GI噁心",preGI_vomit:"前測_GI嘔吐",preGI_diarrhea:"前測_GI腹瀉",preGI_anorexia:"前測_GI厭食",
    preFunc:"前測_活動機能",preFuncDuration:"前測_機能受損期間",preFuncType:"前測_機能受損型態",
    preDxMain:"前測_主要診斷",preDxStress:"前測_代謝壓力",
    sgaFatLoss:"前測SGA_皮下脂肪喪失",sgaMuscleLoss:"前測SGA_肌肉耗損",sgaEdemaAnkle:"前測SGA_腳踝水腫",sgaEdemaSacral:"前測SGA_薦骨水腫",sgaAscites:"前測SGA_腹水",sgaRating:"前測SGA_整體評級",
    postWeight:"後測_體重",postBmi:"後測_BMI",postEgfr:"後測_eGFR",postAlb:"後測_Albumin",postK:"後測_K",postP:"後測_P",postHb:"後測_Hb",
    postW6m:"後測_6月前體重",postWchange:"後測_體重減輕kg",postWchangePct:"後測_體重減輕%",postWt2wk:"後測_近2週體重變化",
    postDietChange:"後測_飲食變化",postDietDuration:"後測_飲食變化期間_週",postDietType:"後測_飲食變化方式",
    postGI_none:"後測_GI無症狀",postGI_nausea:"後測_GI噁心",postGI_vomit:"後測_GI嘔吐",postGI_diarrhea:"後測_GI腹瀉",postGI_anorexia:"後測_GI厭食",
    postFunc:"後測_活動機能",postFuncDuration:"後測_機能受損期間",postFuncType:"後測_機能受損型態",
    postDxMain:"後測_主要診斷",postDxStress:"後測_代謝壓力",
    post_sgaFatLoss:"後測SGA_皮下脂肪喪失",post_sgaMuscleLoss:"後測SGA_肌肉耗損",post_sgaEdemaAnkle:"後測SGA_腳踝水腫",post_sgaEdemaSacral:"後測SGA_薦骨水腫",post_sgaAscites:"後測SGA_腹水",postSgaRating:"後測SGA_整體評級",
    preNote:"前測備註",postNote:"後測備註",susScore:"SUS分數"
  };
  SUPPS.forEach((s,i)=>{COL_MAP["supp_cur_"+i]="目前營養品_"+s;COL_MAP["supp_rec_"+i]="建議營養品_"+s});
  ALL_T.forEach(t=>{
    COL_MAP["preOld_"+t.k+"_lo"]="舊目標_"+t.l+"下限"+t.u;COL_MAP["preOld_"+t.k+"_hi"]="舊目標_"+t.l+"上限"+t.u;COL_MAP["preActual_"+t.k]="前測實際_"+t.l+t.u;
    COL_MAP["t_"+t.k+"_lo"]="新目標_"+t.l+"下限"+t.u;COL_MAP["t_"+t.k+"_hi"]="新目標_"+t.l+"上限"+t.u;
    COL_MAP["postActual_"+t.k]="後測實際_"+t.l+t.u;
  });
  MEALS.forEach(m=>{COL_MAP["preDiet_"+m]="飲食速記_"+m;COL_MAP["postDiet_"+m]="後測飲食_"+m});
  SUS_Q.forEach((_,i)=>{COL_MAP["sus"+(i+1)]="SUS_Q"+(i+1)});
  return COL_MAP;
}
function exportXLSX(){if(recs.length===0)return flash("無資料可匯出");
  const COL_MAP=buildColMap();
  const mapped=recs.map(r=>{const o={"收案週次":calcWeek(r.preDate)};Object.keys(r).forEach(k=>{o[COL_MAP[k]||k]=r[k]});return o});
  const ws=XLSX.utils.json_to_sheet(mapped);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"CRF");XLSX.writeFile(wb,"CRF_營養腎隊友_"+new Date().toISOString().slice(0,10)+".xlsx");flash("✓ 已匯出 Excel")}
function importFile(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(evt){try{const wb=XLSX.read(evt.target.result,{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];const data=XLSX.utils.sheet_to_json(ws);if(data.length>0){
  // Build reverse map: Chinese header -> English key
  const REV={};const CM=buildColMap();Object.keys(CM).forEach(k=>{REV[CM[k]]=k});
  let updated=0,added=0;
  data.forEach(d=>{
    // Remap Chinese headers to English keys
    const mapped={};Object.keys(d).forEach(h=>{const k=REV[h]||h;if(k!=="收案週次")mapped[k]=d[h]!=null?String(d[h]):""});
    const id=mapped.subjectId||d.subjectId||d["受試者編號"];
    if(!id)return;
    mapped.subjectId=id;
    const idx=recs.findIndex(r=>r.subjectId===id);
    if(idx>=0){
      // Smart merge: only overwrite non-empty fields
      Object.keys(mapped).forEach(k=>{if(mapped[k]!=="")recs[idx][k]=mapped[k]});
      updated++;
    }else{
      const nr=newF();Object.keys(mapped).forEach(k=>{nr[k]=mapped[k]});
      recs.push(nr);added++;
    }
  });
  persist();flash("✓ 合併完成：更新 "+updated+" 筆，新增 "+added+" 筆");showList();
}}catch(err){flash("匯入失敗："+err.message)}};reader.readAsArrayBuffer(file);e.target.value=""}
showList();
</script>
