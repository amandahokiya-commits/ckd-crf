<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>營養腎隊友 個案紀錄表</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@700&display=swap');
:root{
  --blue:#3b5998;--blue2:#5b7bd5;--green:#2d8659;--green2:#3da670;
  --orange:#d97706;--orange2:#f59e0b;
  --bg:#f7f5f2;--card:#fff;--input-bg:#fefefe;
  --border:#e8e4df;--text:#3d3929;--text2:#7c7567;--text3:#a8a08f;
  --radius:16px;--shadow:0 2px 8px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15.5px;line-height:1.7;letter-spacing:.3px}
.app{max-width:720px;margin:0 auto;padding:12px 16px 80px}
.header{text-align:center;padding:20px 0 8px}
.header h1{font-family:'Noto Serif TC',serif;font-size:21px;color:var(--blue);letter-spacing:2px}
.header p{font-size:11px;color:var(--text3);margin-top:2px}
.tabs{display:flex;gap:5px;justify-content:center;margin:10px 0 14px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:24px;border:1.5px solid var(--border);background:var(--card);color:var(--text2);font-weight:500;font-size:13.5px;cursor:pointer;font-family:inherit;transition:all .2s}
.tab:hover{border-color:var(--blue2);color:var(--blue)}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.tab.t-green.active{background:var(--green);border-color:var(--green)}
.tab.t-orange.active{background:var(--orange);border-color:var(--orange)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card-title{font-weight:700;font-size:16px;color:var(--blue);margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #ede9e3}
.card-title.green{color:var(--green);border-color:#d1e7d9}
.card-title.orange{color:var(--orange);border-color:#fde3cf}
.row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.lbl{min-width:100px;font-weight:500;font-size:14px;color:var(--text2);flex-shrink:0}
.lbl.wide{min-width:140px}
input[type=text],input[type=number],input[type=date],select,textarea{
  flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:10px;font-size:15.5px;
  font-family:inherit;background:var(--input-bg);color:var(--text);min-width:0;transition:border .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue2);box-shadow:0 0 0 3px rgba(59,89,152,.1)}
textarea{resize:vertical;min-height:60px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:7px 15px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);color:var(--text2);font-size:14px;cursor:pointer;font-family:inherit;transition:all .15s}
.pill:hover{border-color:var(--blue2)}
.pill.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.pill.sel-green{background:var(--green);color:#fff;border-color:var(--green)}
.sub{font-weight:700;font-size:14.5px;color:var(--blue2);margin:16px 0 8px;padding:6px 0;border-bottom:1px dashed #d0d5dd}
.sub.green{color:var(--green2)}.sub.orange{color:var(--orange)}
.auto-val{background:#eef2ff;border-radius:8px;padding:4px 10px;font-weight:600;color:var(--blue);font-size:14px;min-width:60px;text-align:center}
.auto-val.green{background:#ecfdf5;color:var(--green)}
.auto-val.orange{background:#fff7ed;color:var(--orange)}
.warn{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px 14px;margin:8px 0;font-size:13px;color:#991b1b;display:none}
.warn.show{display:block}
.note{font-size:12px;color:var(--text3);margin-top:2px}
.btn{padding:10px 20px;border-radius:10px;border:none;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:var(--blue2)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:var(--green2)}
.btn-orange{background:var(--orange);color:#fff}.btn-orange:hover{background:var(--orange2)}
.btn-gray{background:#e5e7eb;color:var(--text)}.btn-gray:hover{background:#d1d5db}
.btn-new{background:linear-gradient(135deg,#f472b6,#ec4899);color:#fff;border-radius:24px;padding:16px 36px;font-size:17px;font-weight:700;box-shadow:0 4px 16px rgba(236,72,153,.35);letter-spacing:1px;transition:all .2s}
.btn-new:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(236,72,153,.45)}
.sga-wrap{background:linear-gradient(135deg,#f0f4ff,#e8ecf8);border:2px solid #c7d2fe;border-radius:20px;padding:20px 16px;margin:16px 0}
.sga-wrap.green{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#86efac}
.sga-h{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:700;color:var(--blue);text-align:center;margin-bottom:4px}
.sga-h.green{color:var(--green)}
.sga-cite{font-size:11px;color:var(--text3);text-align:center;margin-bottom:14px}
.sga-card{background:#f8fafc;padding:12px;margin:8px 0;border-radius:10px}
.sga-card.green{background:#f0fdf4}
.sga-card-t{font-weight:700;font-size:13px;margin-bottom:8px}
.range-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.range-row .lbl{min-width:120px}
.range-row input{width:80px;flex:none;text-align:center;padding:8px 6px}
.range-row .tilde{color:var(--text3);font-size:16px}
.range-row .unit{font-size:13px;color:var(--text3);min-width:30px}
.achieve{display:inline-block;padding:3px 10px;border-radius:8px;font-weight:600;font-size:13px}
.achieve.ok{background:#dcfce7;color:#16a34a}.achieve.ng{background:#fee2e2;color:#dc2626}
.chk-grid{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chk-item{display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;padding:5px 10px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);transition:all .15s}
.chk-item.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.chk-item.on-green{background:var(--green);color:#fff;border-color:var(--green)}
.chk-item.on-orange{background:var(--orange);color:#fff;border-color:var(--orange)}
.sticky-note{position:sticky;bottom:0;z-index:10;margin:12px -18px -18px;border-top:2px solid #fbbf24;border-radius:0 0 var(--radius) var(--radius);background:#fffbeb;transition:all .2s}
.sticky-note summary{padding:10px 16px;cursor:pointer;font-weight:600;font-size:13px;color:var(--orange);list-style:none;display:flex;align-items:center;gap:6px}
.sticky-note summary::before{content:"📝"}
.sticky-note summary::after{content:"▸";transition:transform .2s;margin-left:auto;font-size:14px}
.sticky-note[open] summary::after{transform:rotate(90deg)}
.sticky-note textarea{width:100%;min-height:120px;border:none;background:transparent;padding:0 16px 14px;font-size:14px;font-family:inherit;resize:vertical;color:var(--text);line-height:1.8}
.sticky-note textarea:focus{outline:none}
.week-badge{display:inline-block;padding:2px 8px;border-radius:10px;background:#dbeafe;color:#1d4ed8;font-size:11px;font-weight:600;margin-left:6px}
.comorbid-other{margin-top:8px}
.patient-bar{background:linear-gradient(135deg,#1e3a5f,#2d5a8e);color:#fff;border-radius:14px;padding:10px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;box-shadow:0 2px 8px rgba(30,58,95,.25);position:sticky;top:0;z-index:20}
.patient-bar .pb-name{font-weight:700;font-size:16px;letter-spacing:.5px}
.patient-bar .pb-info{font-size:12.5px;opacity:.85}
.patient-bar .pb-back{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.patient-bar .pb-back:hover{background:rgba(255,255,255,.35)}
.actions{display:flex;gap:8px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.flash{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#065f46;color:#fff;padding:10px 24px;border-radius:12px;font-weight:600;z-index:99;display:none;font-size:14px}
.hidden{display:none}
.cond{display:none}.cond.show{display:block}
.diet-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.diet-table th{background:#f1f5f9;padding:8px;text-align:left;font-weight:600;border-bottom:2px solid var(--border)}
.diet-table td{padding:6px 8px;border-bottom:1px solid var(--border)}
.diet-table textarea{width:100%;min-height:40px;font-size:13px;border:1px solid var(--border);border-radius:8px;padding:6px;font-family:inherit}
.list-table{width:max-content;min-width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.list-table th{background:var(--blue);color:#fff;padding:6px 8px;text-align:center;font-weight:600;position:sticky;top:0;font-size:11.5px;white-space:nowrap}
.list-table td{padding:5px 8px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
.list-table tr:hover td{background:#f0f7ff}
.list-table .act-btn{padding:4px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:12px;font-family:inherit}
.list-table .act-btn:hover{background:#f0f4ff}

/* ===== v10.2 NEW: Modal overlay ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:20px;max-width:560px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:24px}
.modal h3{font-family:'Noto Serif TC',serif;font-size:18px;color:var(--blue);margin-bottom:12px}
.modal .modal-body{font-size:14px;line-height:1.8;color:var(--text)}
.modal .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.modal .import-preview{max-height:200px;overflow-y:auto;background:#f8f9fa;border-radius:10px;padding:10px;margin:10px 0;font-size:12.5px;border:1px solid var(--border)}
.modal .import-preview .ip-row{padding:4px 0;border-bottom:1px solid #f0eeeb}
.modal .ip-update{color:var(--orange)}.modal .ip-new{color:var(--green)}.modal .ip-skip{color:var(--text3)}

/* ===== v10.2 NEW: Backup panel ===== */
.backup-panel{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1.5px solid #93c5fd;border-radius:16px;padding:16px;margin:14px 0}
.backup-panel h4{font-size:14px;color:#1e40af;margin-bottom:10px;font-weight:700}
.backup-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#fff;border-radius:10px;margin-bottom:6px;border:1px solid #e0e7ff;font-size:13px}
.backup-item .bi-time{color:var(--text2);font-weight:500}
.backup-item .bi-count{color:var(--text3);font-size:12px;margin-left:8px}
.backup-item .bi-actions{display:flex;gap:4px}
.backup-item .bi-btn{padding:4px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:12px;font-family:inherit;font-weight:500}
.backup-item .bi-btn:hover{background:#f0f4ff}
.backup-item .bi-btn.restore{color:#1e40af;border-color:#93c5fd}
.backup-item .bi-btn.restore:hover{background:#dbeafe}

/* ===== v10.2 NEW: Sync status indicator ===== */
.sync-status{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:8px;font-weight:500}
.sync-status.local{background:#fef3c7;color:#92400e}
.sync-status.cloud{background:#dcfce7;color:#166534}
.sync-status.syncing{background:#dbeafe;color:#1e40af}
.sync-status.error{background:#fee2e2;color:#991b1b}
.cloud-bar{background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;box-shadow:0 2px 8px rgba(15,118,110,.25)}
.cloud-bar .cb-info{font-size:13px;opacity:.9}
.cloud-bar button{background:rgba(255,255,255,.2);border:none;color:#fff;padding:7px 14px;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.cloud-bar button:hover{background:rgba(255,255,255,.35)}
.cloud-bar .cb-badge{font-size:12px;padding:3px 10px;border-radius:8px;background:rgba(255,255,255,.15)}
.cloud-setup{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:2px solid #6ee7b7;border-radius:var(--radius);padding:18px;margin-bottom:16px}
.cloud-setup h3{font-size:15px;color:#065f46;margin-bottom:10px}
.cloud-setup input{width:100%;padding:10px;border:1.5px solid #6ee7b7;border-radius:10px;font-size:13px;font-family:monospace;margin:6px 0;background:#fff}
.cloud-setup .hint{font-size:12px;color:#047857;margin-top:8px;line-height:1.7}
.sync-status.synced{background:#d1fae5;color:#065f46}
.sync-status.error{background:#fee2e2;color:#991b1b}

@media(max-width:480px){.lbl{min-width:80px;font-size:12px}.lbl.wide{min-width:110px}.tab{padding:6px 12px;font-size:11.5px}.range-row input{width:65px}.modal{padding:16px}}
</style>
</head>
<body>
<div class="app">
<div class="header">
  <h1>營養腎隊友 個案紀錄表</h1>
  <p>Case Report Form (CRF) v11.3 ｜ 2026.04.17 ｜ <span id="syncBadge" class="sync-status local">💾 本機儲存</span></p>
</div>
<div class="tabs" id="tabbar"></div>
<div id="patientBar" class="hidden"></div>
<div id="flash" class="flash"></div>
<div id="formArea" class="hidden"></div>
<div id="listArea"></div>
<div id="modalRoot"></div>
</div>
<script>
// ============================================================
// v10.2 NEW: Backup & Import Protection System
// ============================================================
const BACKUP_KEY_PREFIX="crf10_backup_";
const MAX_BACKUPS=10;

function createBackup(label){
  const ts=new Date().toISOString();
  const data=JSON.parse(localStorage.getItem("crf10")||"[]");
  if(data.length===0)return;
  const key=BACKUP_KEY_PREFIX+ts;
  const backup={timestamp:ts,label:label||"自動備份",count:data.length,data:JSON.stringify(data)};
  try{
    localStorage.setItem(key,JSON.stringify(backup));
    // Prune old backups
    const allKeys=Object.keys(localStorage).filter(k=>k.startsWith(BACKUP_KEY_PREFIX)).sort();
    while(allKeys.length>MAX_BACKUPS){
      localStorage.removeItem(allKeys.shift());
    }
  }catch(e){console.warn("備份空間不足，清除最舊備份",e);
    const allKeys=Object.keys(localStorage).filter(k=>k.startsWith(BACKUP_KEY_PREFIX)).sort();
    if(allKeys.length>0){localStorage.removeItem(allKeys[0]);try{localStorage.setItem(key,JSON.stringify(backup))}catch(e2){}}
  }
}

function getBackups(){
  return Object.keys(localStorage)
    .filter(k=>k.startsWith(BACKUP_KEY_PREFIX))
    .map(k=>{try{return{...JSON.parse(localStorage.getItem(k)),key:k}}catch(e){return null}})
    .filter(Boolean)
    .sort((a,b)=>b.timestamp.localeCompare(a.timestamp));
}

function restoreBackup(key){
  const raw=localStorage.getItem(key);
  if(!raw)return false;
  try{
    const backup=JSON.parse(raw);
    const data=JSON.parse(backup.data);
    // Create backup of current state before restoring
    createBackup("還原前自動備份");
    localStorage.setItem("crf10",JSON.stringify(data));
    return true;
  }catch(e){return false}
}

function formatTime(iso){
  const d=new Date(iso);
  const mm=String(d.getMonth()+1).padStart(2,"0");
  const dd=String(d.getDate()).padStart(2,"0");
  const hh=String(d.getHours()).padStart(2,"0");
  const mi=String(d.getMinutes()).padStart(2,"0");
  return mm+"/"+dd+" "+hh+":"+mi;
}

// ============================================================
// v10.2 NEW: Modal system
// ============================================================
function showModal(contentFn){
  const root=document.getElementById("modalRoot");
  const overlay=document.createElement("div");
  overlay.className="modal-overlay";
  const modal=document.createElement("div");
  modal.className="modal";
  contentFn(modal,()=>{root.innerHTML=""});
  overlay.appendChild(modal);
  overlay.addEventListener("click",e=>{if(e.target===overlay)root.innerHTML=""});
  root.innerHTML="";
  root.appendChild(overlay);
}

function showImportPreview(data,reverseMap,onConfirm){
  showModal((modal,close)=>{
    const h=document.createElement("h3");h.textContent="⚠️ 匯入預覽 — 請確認";modal.appendChild(h);

    const body=document.createElement("div");body.className="modal-body";

    // Analyze what will happen
    let updates=[],adds=[],skips=[];
    data.forEach(d=>{
      const mapped={};
      Object.keys(d).forEach(hdr=>{const k=reverseMap[hdr]||hdr;if(k!=="收案週次")mapped[k]=d[hdr]!=null?String(d[hdr]):""});
      const id=mapped.subjectId||d.subjectId||d["受試者編號"];
      if(!id){skips.push("(無編號)");return}
      const idx=recs.findIndex(r=>r.subjectId===id);
      if(idx>=0){
        // Count how many fields would change
        let changes=0;
        Object.keys(mapped).forEach(k=>{if(mapped[k]!==""&&mapped[k]!==recs[idx][k])changes++});
        updates.push({id,changes,name:mapped.name||recs[idx].name||""});
      }else{
        adds.push({id,name:mapped.name||""});
      }
    });

    const summary=document.createElement("div");
    summary.style.cssText="background:#fffbeb;border:1.5px solid #fde68a;border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px;line-height:1.8";
    summary.innerHTML="📊 <b>匯入摘要</b><br>"
      +"🔄 更新 <b style='color:var(--orange)'>"+updates.length+"</b> 筆既有個案<br>"
      +"➕ 新增 <b style='color:var(--green)'>"+adds.length+"</b> 筆新個案"
      +(skips.length>0?"<br>⏭ 略過 <b>"+skips.length+"</b> 筆（無編號）":"");
    body.appendChild(summary);

    // Detail preview
    const preview=document.createElement("div");preview.className="import-preview";
    updates.forEach(u=>{
      const row=document.createElement("div");row.className="ip-row ip-update";
      row.textContent="🔄 "+u.id+(u.name?" "+u.name:"")+" — 將更新 "+u.changes+" 個欄位";
      preview.appendChild(row);
    });
    adds.forEach(a=>{
      const row=document.createElement("div");row.className="ip-row ip-new";
      row.textContent="➕ "+a.id+(a.name?" "+a.name:"")+" — 新增";
      preview.appendChild(row);
    });
    if(preview.children.length>0)body.appendChild(preview);

    // Warning
    if(updates.length>0){
      const warn=document.createElement("div");
      warn.style.cssText="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px;margin-top:10px;font-size:13px;color:#991b1b;line-height:1.7";
      warn.innerHTML="⚠️ <b>更新的個案欄位會被 Excel 資料覆蓋</b>（空白欄位不會覆蓋）。<br>系統會自動在匯入前建立備份，可隨時還原。";
      body.appendChild(warn);
    }
    modal.appendChild(body);

    const acts=document.createElement("div");acts.className="modal-actions";
    const cancelBtn=document.createElement("button");cancelBtn.className="btn btn-gray";cancelBtn.textContent="取消";
    cancelBtn.addEventListener("click",close);acts.appendChild(cancelBtn);
    const confirmBtn=document.createElement("button");confirmBtn.className="btn btn-blue";confirmBtn.textContent="✓ 確認匯入";
    confirmBtn.addEventListener("click",()=>{close();onConfirm()});acts.appendChild(confirmBtn);
    modal.appendChild(acts);
  });
}

function showBackupManager(){
  showModal((modal,close)=>{
    const h=document.createElement("h3");h.textContent="🗂 備份管理";modal.appendChild(h);

    const backups=getBackups();
    if(backups.length===0){
      const empty=document.createElement("div");empty.className="modal-body";empty.textContent="尚無備份。儲存個案後系統會自動建立備份。";
      modal.appendChild(empty);
    }else{
      const info=document.createElement("div");info.style.cssText="font-size:13px;color:var(--text2);margin-bottom:12px";
      info.textContent="系統自動保留最近 "+MAX_BACKUPS+" 份備份。還原前會再自動備份目前資料。";
      modal.appendChild(info);

      backups.forEach(b=>{
        const item=document.createElement("div");item.className="backup-item";
        const left=document.createElement("div");
        const time=document.createElement("span");time.className="bi-time";time.textContent=formatTime(b.timestamp);left.appendChild(time);
        const count=document.createElement("span");count.className="bi-count";count.textContent=b.count+"筆 · "+b.label;left.appendChild(count);
        item.appendChild(left);

        const btns=document.createElement("div");btns.className="bi-actions";
        const restoreBtn=document.createElement("button");restoreBtn.className="bi-btn restore";restoreBtn.textContent="還原";
        restoreBtn.addEventListener("click",()=>{

// v11.1: 啟動時自動清理 — 正規化 subjectId + 去重複
(function cleanupRecs(){
  let dirty=false;
  // 1. 正規化所有 subjectId（trim + 前導零修正）
  recs.forEach(r=>{
    if(r.subjectId){
      const norm=normalizeId(r.subjectId);
      if(norm!==r.subjectId){r.subjectId=norm;dirty=true}
    }
  });
  // 2. 去重複（保留最後出現的那筆，通常是最新的）
  const seen={};
  for(let i=recs.length-1;i>=0;i--){
    const id=String(recs[i].subjectId||"").trim();
    const key=id.replace(/^0+/,""); // 去前導零作為 dedup key
    if(!id){recs.splice(i,1);dirty=true;continue}
    if(seen[key]){recs.splice(i,1);dirty=true;console.log("🧹 啟動清理：移除重複 "+id)}
    else{seen[key]=true}
  }
  if(dirty)localStorage.setItem("crf10",JSON.stringify(recs));
})();

// v11.1: 正規化受試者編號 — 處理前導零問題（Excel 會把 "009" 讀成數字 9）
function normalizeId(id){
  if(id===null||id===undefined||id==="")return"";
  let s=String(id).trim();
  // 如果是純數字且現有資料用前導零格式（如 "001"），自動補零
  if(/^\d+$/.test(s)&&recs.length>0){
    // 偵測現有資料的編號格式
    const existing=recs.find(r=>r.subjectId&&/^0\d+$/.test(String(r.subjectId).trim()));
    if(existing){
      const padLen=String(existing.subjectId).trim().length;
      s=s.padStart(padLen,"0");
    }
  }
  return s;
}
// 比對用：忽略前導零差異
function idMatch(a,b){
  const sa=String(a||"").trim(),sb=String(b||"").trim();
  if(sa===sb)return true;
  // 去掉前導零後比對
  if(sa.replace(/^0+/,"")=== sb.replace(/^0+/,""))return true;
  return false;
}

// Google Apps Script 專用：用 GET + URL 參數傳資料（避免 CORS）
// 小資料用 GET，大資料分批送
function gasGet(params){
  return new Promise((resolve,reject)=>{
    const url=SYNC_URL+"?"+new URLSearchParams(params).toString();
    fetch(url,{redirect:"follow"}).then(r=>r.text()).then(t=>{
      try{resolve(JSON.parse(t))}catch(e){
        // Google Apps Script 可能回傳 HTML 頁面（權限問題）
        if(t.includes("Sorry, unable to open the file")||t.includes("Sign in")){
          reject(new Error("權限錯誤：請確認部署時「誰可以存取」選的是「所有人」"))
        }else{reject(new Error("回傳格式錯誤"))}
      }
    }).catch(reject);
  });
}

// v11.2 修正：用隱藏 iframe + form 送 POST（徹底解決 redirect 丟失 body 問題）
function gasPost(payload){
  return new Promise((resolve,reject)=>{
    const id="_gf"+Date.now();
    const iframe=document.createElement("iframe");
    iframe.name=id;iframe.style.display="none";
    document.body.appendChild(iframe);
    const form=document.createElement("form");
    form.method="POST";form.action=SYNC_URL;form.target=id;form.style.display="none";
    const input=document.createElement("input");
    input.name="payload";input.value=JSON.stringify(payload);
    form.appendChild(input);document.body.appendChild(form);
    
    let resolved=false;
    // Google Apps Script 回傳 JSON，但 iframe 無法讀取跨域內容
    // 所以我們假設提交成功（如果 iframe load 了就代表 server 收到了）
    iframe.onload=function(){
      if(resolved)return;resolved=true;
      console.log("☁️ POST 已送達: "+payload.action+(payload.data?(" id="+(payload.data.subjectId||"batch")):""));
      setTimeout(()=>{document.body.removeChild(iframe);document.body.removeChild(form)},1000);
      // 因為跨域無法讀 iframe 內容，我們用 GET 確認結果
      if(payload.action==="save"&&payload.data&&payload.data.subjectId){
        // 驗證寫入是否成功
        gasGet({action:"get",id:payload.data.subjectId}).then(r=>{
          if(r.success){console.log("☁️ ✓ 驗證成功: "+payload.data.subjectId);resolve({success:true,action:"verified",id:payload.data.subjectId})}
          else{console.warn("☁️ ⚠ 驗證失敗",r);resolve({success:true,action:"sent_unverified"})}
        }).catch(e=>{console.warn("☁️ 驗證請求失敗",e);resolve({success:true,action:"sent_unverified"})});
      }else if(payload.action==="saveAll"){
        gasGet({action:"export"}).then(r=>{
          if(r.success){console.log("☁️ ✓ 批次驗證: "+r.count+"筆");resolve({success:true,updated:r.count||0,created:0})}
          else{resolve({success:true,action:"sent_unverified"})}
        }).catch(()=>resolve({success:true,action:"sent_unverified"}));
      }else{
        resolve({success:true,action:"sent"});
      }
    };
    iframe.onerror=function(){
      if(resolved)return;resolved=true;
      document.body.removeChild(iframe);document.body.removeChild(form);
      reject(new Error("送出失敗"));
    };
    // 超時保護
    setTimeout(()=>{
      if(resolved)return;resolved=true;
      try{document.body.removeChild(iframe);document.body.removeChild(form)}catch(e){}
      reject(new Error("送出逾時（15秒）"));
    },15000);
    form.submit();
  });
}

let _cloudSaving={};
async function cloudSave(record){
  if(!SYNC_URL)return;
  const id=record.subjectId;
  // 防止短時間內對同一個案重複送出
  if(_cloudSaving[id]){console.log("☁️ 跳過重複送出: "+id);return}
  _cloudSaving[id]=true;
  const el=document.getElementById("syncBadge");
  if(el){el.className="sync-status syncing";el.textContent="🔄 同步中..."}

    const j=await gasPost({action:"save",data:record});

    else{if(el){el.className="sync-status error";el.textContent="⚠️ "+(j.error||"失敗")}}
  }catch(e){if(el){el.className="sync-status error";el.textContent="⚠️ "+e.message};console.error("☁️",e)}
  finally{setTimeout(()=>{delete _cloudSaving[id]},3000)}
}
async function cloudSyncAll(){

async function cloudPull(){
  if(!SYNC_URL)return alert("請先設定雲端同步網址");
  const el=document.getElementById("cloudBadge");
  if(el){el.textContent="🔄 拉回中..."}
  try{
    // 拉回前先自動備份
    createBackup("雲端拉回前自動備份");
    const j=await gasGet({action:"export"});
    if(j.success&&j.data){
      let updated=0,added=0,skipped=0;
      j.data.forEach(rec=>{
        if(!rec.subjectId)return;
        const idx=recs.findIndex(x=>x.subjectId===rec.subjectId);
        if(idx>=0){
          // 時間戳記比對：只有雲端資料比本機新才覆蓋
          const localTime=recs[idx]._lastModified||"";
          const cloudTime=rec._lastModified||"";
          if(cloudTime&&localTime&&cloudTime<=localTime){
            skipped++;return; // 本機較新，不覆蓋
          }
          Object.keys(rec).forEach(k=>{if(rec[k]!=="")recs[idx][k]=rec[k]});
          updated++;
        }
        else{const nr=newF();Object.keys(rec).forEach(k=>{nr[k]=rec[k]});recs.push(nr);added++}
      });
      persist("雲端拉回");
      let msg="☁️ 已從雲端拉回：更新 "+updated+" 筆，新增 "+added+" 筆";
      if(skipped>0)msg+="，跳過 "+skipped+" 筆（本機較新）";
      flash(msg);showList();
    }else{flash("☁️ 拉回失敗："+(j.error||"無資料"))}
  }catch(e){flash("☁️ 拉回錯誤："+e.message)}
}
async function cloudDelete(id){
  if(!SYNC_URL)return;
  try{await gasPost({action:"delete",id:id})}catch(e){console.error("☁️",e)}
}

function mkRange(tItem,prefix){
  const r=document.createElement("div");r.className="range-row";
  const l=document.createElement("div");l.className="lbl";l.textContent=tItem.e+" "+tItem.l;r.appendChild(l);
  const loK=prefix+tItem.k+"_lo",hiK=prefix+tItem.k+"_hi";
  const tv=document.createElement("input");tv.type="number";tv.step="0.1";tv.placeholder="目標值";tv.style.cssText="width:80px;text-align:center;border:1.5px solid var(--orange);border-radius:10px;background:#fffbeb;font-weight:600";
  if(F[loK]&&F[hiK]){const mid=((parseFloat(F[loK])+parseFloat(F[hiK]))/2);tv.value=mid?mid.toFixed(1):"";}
  const rangeSpan=document.createElement("span");rangeSpan.style.cssText="font-size:12px;color:var(--text3);margin-left:6px";
  if(F[loK]&&F[hiK]){rangeSpan.textContent="("+F[loK]+" ~ "+F[hiK]+")";}else{rangeSpan.textContent="";}
  tv.addEventListener("input",()=>{
    const v=parseFloat(tv.value);
    if(v>0){const loV=(v*0.8).toFixed(1),hiV=(v*1.2).toFixed(1);F[loK]=loV;F[hiK]=hiV;rangeSpan.textContent="("+loV+" ~ "+hiV+")";}

  });
  r.appendChild(tv);
  const u=document.createElement("span");u.className="unit";u.textContent=tItem.u;r.appendChild(u);
  r.appendChild(rangeSpan);
  return r;
}

  function dpGetProRef(stage,bwv){

      p+=v*food.p;ch+=v*food.c;ft+=v*food.f;kc+=v*food.kcal;
    })});
    return{p:p,c:ch,f:ft,kcal:kc};
  }

function doSave(){
  if(!F.subjectId)return flash("請先填寫受試者編號");
  // v11.1: 正規化編號
  F.subjectId=normalizeId(F.subjectId);
  // 加入修改時間戳記
  F._lastModified=new Date().toISOString();
  const trimId=F.subjectId;
  // v11.1: 用 idMatch 比對，處理前導零
  const ex=recs.findIndex(r=>idMatch(r.subjectId,trimId));
  if(editIdx!==null){
    recs[editIdx]={...F};
    recs[editIdx].subjectId=trimId;
    // 清除重複筆
    for(let i=recs.length-1;i>=0;i--){
      if(i!==editIdx&&idMatch(recs[i].subjectId,trimId)){
        console.log("⚠️ 清除重複筆: index="+i+" id="+recs[i].subjectId);
        recs.splice(i,1);
        if(i<editIdx)editIdx--;
      }
    }
  }
  else if(ex>=0){recs[ex]={...F};editIdx=ex}
  else{recs.push({...F});editIdx=recs.length-1}
  persist("儲存 "+F.subjectId);cloudSave({...F});flash("✓ 已儲存 "+F.subjectId);updateTabbar();updatePatientBar();
}

  SUS_Q.forEach((_,i)=>{COL_MAP["sus"+(i+1)]="SUS_Q"+(i+1)});

}
function exportXLSX(){if(recs.length===0)return flash("無資料可匯出");
  const COL_MAP=buildColMap();
  const mapped=recs.map(r=>{
    const o={"收案週次":calcWeek(r.preDate)};
    Object.keys(r).forEach(k=>{o[COL_MAP[k]||k]=r[k]});
    o["受試者編號"]=String(r.subjectId||"");
    ALL_T.forEach(t=>{
      const lo=parseFloat(r["t_"+t.k+"_lo"]),hi=parseFloat(r["t_"+t.k+"_hi"]);
      o["新目標_"+t.l+t.u]=(!isNaN(lo)&&!isNaN(hi))?Math.round((lo+hi)/2*10)/10:"";
    });
    return o;
  });
  // === 摘要工作表 ===
  var sumRows=[["個案資料完成度摘要","","","","","","","","","","匯出時間："+new Date().toLocaleString("zh-TW")],[]];
  sumRows.push(["編號","姓名","電話","病歷號","CKD","eGFR","Alb","SGA","收案","後測預定",
    "基本資料","生化檢驗","飲食計畫","舊目標","新目標","24hr速記","營養品","SUS","缺少項目"]);
  var sortedR=[...recs].sort((a,b)=>(a.subjectId||"").localeCompare(b.subjectId||"",undefined,{numeric:true}));
  sortedR.forEach(function(r){
    // 檢查各區塊完成度
    var chkBasic=(r.name&&r.chartNo&&r.height&&r.weight&&r.ckdStage)?"✓":"✗";
    var chkLab=(r.preEgfr&&r.preAlb)?"✓":(r.preEgfr||r.preAlb)?"△":"✗";
    var dpCount=0;DP_ALL_KEYS.forEach(function(k){if(r[k]&&parseFloat(r[k])>0)dpCount++});
    var chkDP=dpCount>=3?"✓("+dpCount+"項)":dpCount>0?"△("+dpCount+"項)":"✗";
    var oldCount=0;ALL_T.forEach(function(t){if(r["preOld_"+t.k+"_lo"])oldCount++});
    var chkOld=oldCount>=4?"✓":"✗("+oldCount+"/"+ALL_T.length+")";
    var newCount=0;ALL_T.forEach(function(t){if(r["t_"+t.k+"_lo"])newCount++});
    var chkNew=newCount>=4?"✓":"✗("+newCount+"/"+ALL_T.length+")";
    var mealCount=0;MEALS.forEach(function(m){if(r["preDiet_"+m])mealCount++});
    var chkMeal=mealCount>=3?"✓":"✗("+mealCount+"/4)";
    var suppCount=0;SUPPS.forEach(function(_,i){if(r["supp_cur_"+i])suppCount++});
    var chkSupp=suppCount>0?"✓":"—";
    var chkSUS=r.susScore?"✓("+r.susScore+")":"✗";
    // 缺少項目
    var missing=[];
    if(chkBasic==="✗")missing.push("基本資料");
    if(chkLab==="✗")missing.push("生化");
    if(chkDP.charAt(0)==="✗")missing.push("飲食計畫");
    if(chkOld.charAt(0)==="✗")missing.push("舊目標");
    if(chkNew.charAt(0)==="✗")missing.push("新目標");
    if(chkMeal.charAt(0)==="✗")missing.push("24hr速記");
    if(chkSUS.charAt(0)==="✗")missing.push("SUS");
    // 後測預定
    var postPlan="";if(r.postDate){postPlan=r.postDate}else if(r.preDate){var pd=new Date(r.preDate);pd.setDate(pd.getDate()+84);postPlan=pd.toISOString().slice(0,10)}
    sumRows.push([
      String(r.subjectId||""),r.name||"",r.phone||"",r.chartNo||"",
      r.ckdStage||"",r.preEgfr||"",r.preAlb||"",r.sgaRating||"",
      r.preDate||"",postPlan,
      chkBasic,chkLab,chkDP,chkOld,chkNew,chkMeal,chkSupp,chkSUS,
      missing.length>0?missing.join("、"):"全部完成 ✓"
    ]);
  });
  // 建立 workbook
  var ws=XLSX.utils.json_to_sheet(mapped);
  var range=XLSX.utils.decode_range(ws["!ref"]||"A1");
  for(var row=range.s.r+1;row<=range.e.r;row++){
    var cell=ws[XLSX.utils.encode_cell({r:row,c:1})];
    if(cell){cell.t="s";cell.v=String(cell.v||"")}
  }
  var wsSummary=XLSX.utils.aoa_to_sheet(sumRows);
  // 摘要表欄寬
  wsSummary["!cols"]=[{wch:8},{wch:8},{wch:14},{wch:12},{wch:5},{wch:7},{wch:5},{wch:5},{wch:10},{wch:10},{wch:7},{wch:7},{wch:12},{wch:12},{wch:12},{wch:10},{wch:7},{wch:10},{wch:20}];
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,wsSummary,"摘要");
  XLSX.utils.book_append_sheet(wb,ws,"CRF");
  XLSX.writeFile(wb,"CRF_營養腎隊友_"+new Date().toISOString().slice(0,10)+".xlsx");
  flash("✓ 已匯出 Excel（含摘要工作表）")
}

// v11.1: ENHANCED importFile with trim, full-overwrite option, unknown column filter
function importFile(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(evt){
    try{
      const wb=XLSX.read(evt.target.result,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const data=XLSX.utils.sheet_to_json(ws);
      if(data.length===0)return flash("Excel 檔案無資料");

      // Build reverse map
      const REV={};const CM=buildColMap();
      Object.keys(CM).forEach(k=>{REV[CM[k]]=k});
      // 建立合法 key 集合，過濾掉匯出時產生的計算欄位
      const VALID_KEYS=new Set(Object.keys(CM));
      VALID_KEYS.add("收案週次"); // 會被跳過但要能識別

      // Show preview modal instead of directly importing
      showImportPreview(data,REV,()=>{
        // Create backup BEFORE import
        createBackup("匯入前自動備份");

        // 詢問匯入模式
        const fullOverwrite=confirm(
          "請選擇匯入模式：\n\n"+
          "【確定】完整覆蓋模式 — Excel 的空白欄位會清除本機舊值\n"+
          "　（適合：把 Excel 當作唯一正確來源）\n\n"+
          "【取消】合併模式 — 只更新非空白欄位，保留本機既有值\n"+
          "　（適合：只想補充部分資料）"
        );

        let updated=0,added=0;
        data.forEach(d=>{
          const mapped={};
          Object.keys(d).forEach(h=>{
            const k=REV[h]||h;
            if(k==="收案週次")return; // 跳過計算欄位
            // v11.1: 只保留合法的 key，過濾掉匯出產生的額外欄位（如「新目標_熱量kcal」）
            if(!VALID_KEYS.has(k))return;
            mapped[k]=d[h]!=null?String(d[h]):"";
          });
          // v11.1: subjectId 正規化（處理前導零 + 去空白）
          let id=mapped.subjectId||d.subjectId||d["受試者編號"];
          if(!id)return;
          id=normalizeId(id);
          mapped.subjectId=id;
          // v11.1: 用 idMatch 比對（忽略前導零差異）
          const idx=recs.findIndex(r=>idMatch(r.subjectId,id));
          if(idx>=0){
            if(fullOverwrite){
              // 完整覆蓋：以 Excel 為準，空白欄位也寫入（清除舊值）
              Object.keys(mapped).forEach(k=>{recs[idx][k]=mapped[k]});
            }else{
              // 合併模式：只更新非空白
              Object.keys(mapped).forEach(k=>{if(mapped[k]!=="")recs[idx][k]=mapped[k]});
            }
            updated++;
          }else{
            const nr=newF();Object.keys(mapped).forEach(k=>{nr[k]=mapped[k]});
            recs.push(nr);added++;
          }
        });
        localStorage.setItem("crf10",JSON.stringify(recs));
        flash("✓ "+(fullOverwrite?"完整覆蓋":"合併")+"完成：更新 "+updated+" 筆，新增 "+added+" 筆");
        showList();
      });
    }catch(err){flash("匯入失敗："+err.message)}
  };
  reader.readAsArrayBuffer(file);e.target.value="";
}

showList();
updateSyncUI();
</script>
